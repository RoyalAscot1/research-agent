# Ruff configuration for the Lens backend.
# Docs: https://docs.astral.sh/ruff/
# Target the oldest interpreter the code must run on (local dev venv is 3.10),
# even though the production Docker image is 3.12 — this stops Ruff from
# suggesting 3.11+-only syntax like `datetime.UTC` that breaks local imports.
target-version = "py310"
line-length = 100

exclude = [
    ".venv",
    "alembic/versions",  # autogenerated migrations
    "__pycache__",
]

[lint]
# E/W: pycodestyle, F: pyflakes, I: isort (import sorting),
# B: flake8-bugbear, UP: pyupgrade, C4: comprehensions.
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
]

[lint.flake8-bugbear]
# FastAPI's dependency-injection pattern *requires* calling Depends()/Query()/etc.
# in argument defaults, so B008 ("no function calls in defaults") is a false
# positive here. Whitelist the framework helpers we actually use.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[format]
quote-style = "double"
